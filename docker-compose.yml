services:
  core:
    container_name: maim-bot-core
    #### prod ####
    image: sengokucola/maibot:latest
    # image: infinitycat/maibot:latest
    #### dev ####
    # image: sengokucola/maibot:dev
    # image: infinitycat/maibot:dev
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - EULA_AGREE=1b662741904d7155d1ce1c00b3530d0d
      - PRIVACY_AGREE=9943b855e72199d0f5016ea39052f1b6
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1 # Docker 无法交互确认旧版升级迁移，默认跳过确认提示
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html # 统计数据输出到共享目录，首次运行可自动创建文件
#      - EULA_AGREE=1b662741904d7155d1ce1c00b3530d0d # 同意EULA
#      - PRIVACY_AGREE=9943b855e72199d0f5016ea39052f1b6 # 同意EULA
    ports:
      - "18001:8001" # webui端口
#      - "8000:8000"
    volumes:
      # 监听地址和端口已迁移到 ./docker-config/mmc/bot_config.toml 的 maim_message 与 webui 配置段
      - ./docker-config/mmc:/MaiMBot/config:Z # 持久化bot配置文件
      - ./data/MaiMBot:/MaiMBot/data:z # 共享目录
      - ./data/MaiMBot/emoji:/data/emoji:Z # 持久化表情包
      - ./data/MaiMBot/plugins:/MaiMBot/plugins:Z # 插件目录
      - ./data/MaiMBot/logs:/MaiMBot/logs:Z # 日志目录
      - ./data/MaiMBot/depends-data:/MaiMBot/depends-data:Z # 运行时资源文件
      # - site-packages:/usr/local/lib/python3.13/site-packages # 持久化Python包，需要时启用
    entrypoint: uv run --no-sync bot.py
    restart: unless-stopped
    networks:
      - maim_bot

  napcat:
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "6099:6099"
    volumes:
      - ./docker-config/napcat:/app/napcat/config:Z # 持久化napcat配置文件
      - ./data/qq:/app/.config/QQ:Z # 持久化QQ本体
    container_name: maim-bot-napcat
    mac_address: DE:C0:DE:C0:FF:EE
    restart: unless-stopped
    image: mlikiowa/napcat-docker:latest
    networks:
      - maim_bot

  # 启用 HTTPS 时，建议注释掉 core 服务中的 "18001:8001" 端口映射，
  # 然后取消注释此 Caddy 反向代理示例块，并按 dashboard/docs/Caddyfile.docker.example 修改域名。
  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    container_name: maim-bot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./data/caddy:/data:Z
      - ./docker-config/caddy:/config:Z
    depends_on:
      - core
    networks:
      - maim_bot

  sqlite-web:
    profiles:
      - sqlite-web
    # 注意：coleifer/sqlite-web 镜像不支持arm64
    image: coleifer/sqlite-web:latest
    container_name: sqlite-web
    restart: unless-stopped
    ports:
      - "8120:8080"
    volumes:
      - ./data/MaiMBot:/data/MaiMBot:z
    environment:
      - SQLITE_DATABASE=MaiMBot/MaiBot.db  # 你的数据库文件
    networks:
      - maim_bot

  # chat2db占用相对较高但是功能强大
  # 内存占用约600m，内存充足推荐选此
  chat2db:
    profiles:
      - chat2db
    image: chat2db/chat2db:latest
    container_name: maim-bot-chat2db
    restart: unless-stopped
    ports:
      - "10824:10824"
    volumes:
      - ./data/MaiMBot:/data/MaiMBot:z
      - ./data/chat2db:/root/.chat2db/db:Z
    networks:
      - maim_bot

networks:
  maim_bot:
    driver: bridge
